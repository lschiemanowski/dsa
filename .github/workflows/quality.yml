name: quality

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked environment
        run: uv sync --all-groups --all-extras --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest

      - name: Set up Node for the wheel build
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build and verify the wheel
        shell: bash
        run: |
          DSA_BUILD_CHAT_UI=1 uv build
          wheel=(dist/*.whl)
          uv venv "$RUNNER_TEMP/dsa-wheel-venv" --python 3.12
          uv export --frozen --no-dev --extra chat --no-emit-project --no-hashes --output-file "$RUNNER_TEMP/dsa-wheel-constraints.txt"
          uv pip install --python "$RUNNER_TEMP/dsa-wheel-venv/bin/python" --constraint "$RUNNER_TEMP/dsa-wheel-constraints.txt" "${wheel[0]}[chat]"
          uv run --no-sync python -m tests.private_data_chat.wheel_smoke "$RUNNER_TEMP/dsa-wheel-venv/bin/dsa"
