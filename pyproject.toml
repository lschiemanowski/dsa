[project]
name = "dsa"
version = "0.1.0"
description = "A small, auditable data science agent with verifiable outputs"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "duckdb==1.5.5",
    "jsonschema>=4.25,<5",
    "pyarrow==25.0.1",
    "pydantic>=2.12,<3",
    "pydantic-ai-slim[openai]>=1.107,<2",
    "referencing>=0.37,<1",
]

[project.scripts]
dsa-benchmark = "dsa.benchmark_cli:main"

[project.optional-dependencies]
huggingface = [
    "huggingface-hub>=1,<2",
]
mlflow = [
    "mlflow[databricks]==3.15.2",
]

[dependency-groups]
dev = [
    "pyarrow-stubs==20.0.0.20260819",
    "pyright>=1.1.408,<2",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "databricks: opt-in tests that exercise the real Databricks MLflow boundary",
    "integration: opt-in tests that exercise a real external runtime boundary",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
