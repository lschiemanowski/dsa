[project]
name = "dsa"
version = "0.1.0"
description = "A small, auditable data science agent with verifiable outputs"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "duckdb==1.5.5",
    "jsonschema>=4.25,<5",
    "nbformat>=5.10,<6",
    "pillow>=12.3,<13",
    "pyarrow==25.0.1",
    "pydantic>=2.12,<3",
    "pydantic-ai-slim[openai]>=1.107,<2",
    "referencing>=0.37,<1",
    "tomli-w>=1.2,<2",
]

[project.scripts]
dsa = "apps.cli:main"
dsa-benchmark = "dsa.benchmark_cli:main"
dsa-run = "dsa.run_cli:main"

[project.optional-dependencies]
chat = [
    "fastapi>=0.141.1,<1",
    "huggingface-hub>=1,<2",
    "uvicorn>=0.52.4,<1",
]
huggingface = [
    "huggingface-hub>=1,<2",
]
logfire = [
    "logfire>=4.41,<5",
    "opentelemetry-api>=1.37,<2",
    "pydantic-evals[logfire]>=1.107.5,<2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1",
    "pyarrow-stubs==20.0.0.20260819",
    "pyright>=1.1.408,<2",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["/apps/private_data_chat/web/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/dsa", "apps"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "integration: opt-in tests that exercise a real external runtime boundary",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# Preserve the exact recorded artifact; handwritten example code remains linted.
extend-exclude = ["examples/smard/smard-monthly-generation-demo.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "apps/private_data_chat", "tests"]
venvPath = "."
venv = ".venv"
